name: ai-home-lab-mcp

services:
  garmin-mcp:
    build:
      context: ../..
      dockerfile: src/mcp-servers/garmin-mcp/Dockerfile
    env_file: ../../.env
    environment:
      MCP_TRANSPORT: streamable-http
    networks:
      - mcp-internal
      - edge
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped

  actual-mcp:
    image: sstefanov/actual-mcp:latest
    env_file: ../../.env
    environment:
      ACTUAL_DATA_DIR: /data
      ACTUAL_SERVER_URL: ${ACTUAL_SERVER_URL}
      ACTUAL_PASSWORD: ${ACTUAL_PASSWORD}
      ACTUAL_BUDGET_SYNC_ID: ${ACTUAL_BUDGET_SYNC_ID:-}
      ACTUAL_BUDGET_ENCRYPTION_PASSWORD: ${ACTUAL_BUDGET_ENCRYPTION_PASSWORD:-}
      BEARER_TOKEN: ${ACTUAL_BEARER_TOKEN}
    command: ["--sse", "--enable-write", "--enable-bearer"]
    volumes:
      - actual-mcp-data:/data
    networks:
      - mcp-internal
      - edge
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('net').createConnection(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped

networks:
  edge:
    driver: bridge
  mcp-internal:
    internal: true

volumes:
  actual-mcp-data:
