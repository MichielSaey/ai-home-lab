name: ai-home-lab-mcp

services:
  garmin-mcp:
    build:
      context: ../..
      dockerfile: src/mcp-servers/garmin-mcp/Dockerfile
    env_file: ../../.env
    networks:
      - mcp-internal
      - edge
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s=socket.create_connection(('127.0.0.1',8000),5); s.close()\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped

networks:
  edge:
    driver: bridge
  mcp-internal:
    internal: true
