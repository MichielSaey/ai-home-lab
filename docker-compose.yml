services:
  garmin-mcp:
    build:
      context: .
      dockerfile: mcp-servers/garmin-mcp/Dockerfile
    env_file: .env
    networks:
      - mcp-internal
      - edge
    expose:
      - "8000"

  garmin-trainer:
    build:
      context: .
      dockerfile: agents/garmin-trainer/Dockerfile
    env_file: .env
    depends_on:
      - garmin-mcp
    networks:
      - edge
      - mcp-internal
    ports:
      - "8001:8001"
    volumes:
      - ai_home_lab_data:/data

  adhd-life-aid:
    image: python:3.11-slim
    env_file: .env
    command: ["python", "-m", "http.server", "8002"]
    networks:
      - edge
      - mcp-internal
    ports:
      - "8002:8002"
    volumes:
      - ai_home_lab_data:/data

networks:
  mcp-internal:
    internal: true
  edge:
    driver: bridge

volumes:
  ai_home_lab_data:
