services:
  garmin-mcp:
    build:
      context: .
      dockerfile: mcp-servers/garmin-mcp/Dockerfile
    env_file: .env
    networks:
      - mcp-internal
      - edge
    expose:
      - "8000"
      
  agent_hub:
    build:
      context: .
      dockerfile: agents/agent_hub/Dockerfile
    env_file: .env
    networks:
      - edge
      - mcp-internal
    ports:
      - "8001:8001"
    volumes:
      - ai_home_lab_data:/data

networks:
  mcp-internal:
    internal: true
  edge:
    driver: bridge

volumes:
  ai_home_lab_data:
