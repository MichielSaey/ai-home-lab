include:
  - path: vendor/odysseus/docker-compose.yml
    env_file: .env

services:
  garmin-mcp:
    build:
      context: .
      dockerfile: src/mcp-servers/garmin-mcp/Dockerfile
    env_file: .env
    networks:
      - mcp-internal
      - edge
    expose:
      - "8000"

  # Reach garmin-mcp on the shared edge network (configure MCP URL in Odysseus admin).
  odysseus:
    networks:
      - default
      - edge

networks:
  mcp-internal:
    internal: true
  edge:
    driver: bridge
