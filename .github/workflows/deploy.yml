name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - name: Ensure .env exists
        run: |
          if [ ! -f .env ]; then
            echo "ERROR: .env not found in repo checkout. Create it on the CasaOS server before deploying."
            exit 1
          fi

      - name: Vendor Odysseus
        run: chmod +x scripts/ensure-odysseus.sh && ./scripts/ensure-odysseus.sh

      - name: Build and start services
        run: docker compose up -d --build --remove-orphans

      - name: Show service status
        run: docker compose ps
