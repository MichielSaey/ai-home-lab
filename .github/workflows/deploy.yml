name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      # Doc-only commits should not rebuild Odysseus / MCP.
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          submodules: false
          # Keep .env and vendored trees on the runner checkout.
          clean: false

      - name: Check runner disk space
        run: |
          df -h .
          free_mb="$(df -Pm . | awk 'NR==2 {print $4}')"
          if [ "${free_mb}" -lt 1024 ]; then
            echo "ERROR: less than 1 GB free on the runner filesystem (${free_mb} MB). Free space before deploying."
            exit 1
          fi

      - name: Ensure .env exists
        run: |
          if [ ! -f .env ]; then
            echo "ERROR: .env not found in repo checkout. Create it on the CasaOS server before deploying."
            exit 1
          fi

      - name: Vendor Odysseus
        run: chmod +x scripts/ensure-odysseus.sh && ./scripts/ensure-odysseus.sh

      - name: Vendor Vibe-Workflow
        run: chmod +x scripts/ensure-vibe-workflow.sh && ./scripts/ensure-vibe-workflow.sh

      - name: Build and start services
        # Do not --wait on the full project: optional MCPs (e.g. todoist without
        # TODOIST_API_KEY) can be unhealthy and would fail the job. Odysseus is
        # checked in the next step.
        run: docker compose up -d --build --remove-orphans

      - name: Wait for stack health
        run: chmod +x scripts/wait-for-stack.sh && ./scripts/wait-for-stack.sh

      - name: Show service status
        run: docker compose ps

      - name: Notify deploy success
        if: success()
        run: |
          chmod +x scripts/notify-deploy.sh
          ./scripts/notify-deploy.sh success "Deploy $(git rev-parse --short HEAD) succeeded on $(hostname)"

      - name: Notify deploy failure
        if: failure() && steps.checkout.outcome == 'success'
        run: |
          chmod +x scripts/notify-deploy.sh
          ./scripts/notify-deploy.sh failure "Deploy $(git rev-parse --short HEAD) failed on $(hostname)"
