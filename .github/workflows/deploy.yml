name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Odysseus vendor checkout
        run: ./scripts/ensure-odysseus.sh
      - name: Build and start services
        run: docker compose up -d --build
