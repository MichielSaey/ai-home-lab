name: ai-home-lab-vibe-workflow

# Vibe-Workflow is vendored at services/vibe-workflow/ (see scripts/ensure-vibe-workflow.sh).
# Uses the repo-root .env for MU_API_KEY and port bindings.

services:
  vibe-workflow-server:
    build:
      context: vibe-workflow/server
      dockerfile: Dockerfile
    env_file: ../.env
    environment:
      MU_API_KEY: ${MU_API_KEY:-}
    ports:
      - "${VIBE_WORKFLOW_BIND:-0.0.0.0}:${VIBE_WORKFLOW_SERVER_PORT:-8010}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - edge
    restart: unless-stopped

  vibe-workflow-client:
    build:
      context: vibe-workflow
      dockerfile: client/Dockerfile
      args:
        API_URL: http://vibe-workflow-server:8000
    environment:
      NODE_ENV: production
      API_URL: http://vibe-workflow-server:8000
    ports:
      - "${VIBE_WORKFLOW_BIND:-0.0.0.0}:${VIBE_WORKFLOW_CLIENT_PORT:-7300}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    depends_on:
      vibe-workflow-server:
        condition: service_healthy
    networks:
      - edge
    restart: unless-stopped

networks:
  edge:
    driver: bridge
