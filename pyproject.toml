[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-home-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "chainlit",
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "langchain",
    "langchain-community",
    "langchain-litellm",
    "botocore",
    "mcp",
    "cryptography",
    "aiosqlite",
    "icecream",
]

[project.scripts]
epub2audiobook = "epub2audiobook.cli:main"

[dependency-groups]
dev = [
    "ipykernel",
    "ipywidgets",
]
epub-audiobook = [
    "en-core-web-sm",
    "ipywidgets",
    "ebooklib",
    "beautifulsoup4",
    "lxml",
    "nltk",
    "transformers>=5.0,<5.10", # 5.10+ needs torch.float8_e8m0fnu (torch 2.7+)
    "accelerate",
    "bitsandbytes",
    "kokoro>=0.9.4",
    "soundfile",
    "pydub",
    "mutagen",
    "torch",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.hatch.build.targets.wheel]
packages = ["src/agents", "src/shared", "src/epub2audiobook/src/epub2audiobook"]

[tool.hatch.build.targets.wheel.sources]
"src/agents" = "agents"
"src/shared" = "shared"
"src/epub2audiobook/src/epub2audiobook" = "epub2audiobook"
