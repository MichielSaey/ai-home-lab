[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-home-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "chainlit",
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "langchain",
    "langchain-community",
    "langchain-litellm",
    "botocore",
    "mcp",
    "cryptography",
    "aiosqlite",
    "icecream",
]

[dependency-groups]
dev = [
    "ipykernel",
    "ipywidgets",
]
epub-audiobook = [
    "ipywidgets",
    "ebooklib",
    "beautifulsoup4",
    "lxml",
    "nltk",
    "transformers>=5.0,<5.10", # 5.10+ needs torch.float8_e8m0fnu (torch 2.7+)
    "accelerate",
    "bitsandbytes",
    "kokoro>=0.9.4",
    "soundfile",
    "pydub",
    "mutagen",
    "torch",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[tool.hatch.build.targets.wheel]
packages = ["agents", "shared"]
