services:
  garmin-mcp:
    build:
      context: ..
      dockerfile: mcp-servers/garmin-mcp/Dockerfile
    env_file: ../.env
    networks:
      - mcp-internal
      - edge
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s=socket.create_connection(('127.0.0.1',8000),5); s.close()\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped

  mcp-workbench:
    profiles:
      - dev
    build:
      context: ..
      dockerfile: mcp-servers/mcp-workbench/Dockerfile
    environment:
      PORT: "3001"
      MCP_WORKBENCH_WEB_PORT: "5173"
      GARMIN_MCP_SSE_URL: http://garmin-mcp:8000/sse
    ports:
      - "5173:5173"
    networks:
      - edge
    depends_on:
      - garmin-mcp

  mcp-inspector:
    profiles:
      - dev
    image: ghcr.io/modelcontextprotocol/inspector:latest
    ports:
      - "6274:6274"
      - "6277:6277"
    environment:
      HOST: 0.0.0.0
      MCP_AUTO_OPEN_ENABLED: "false"
      DANGEROUSLY_OMIT_AUTH: "true"
      MCP_SERVER_REQUEST_TIMEOUT: "300000"
    networks:
      - edge
    depends_on:
      - garmin-mcp

  garmin-mcp-ui:
    profiles:
      - dev
    image: caddy:2-alpine
    ports:
      - "6280:6280"
    volumes:
      - ./mcp-workbench/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./mcp-workbench/landing.html:/srv/index.html:ro
    networks:
      - edge
    depends_on:
      - mcp-inspector

networks:
  edge:
    driver: bridge
  mcp-internal:
    internal: true
